name: Deploy Worker (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # worker est un workspace → npm ci à la racine installe wrangler (version épinglée).
      - run: npm ci
      - name: wrangler deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optionnel : nécessaire seulement si le token couvre plusieurs comptes.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `wrangler deploy` résume un échec en « A request to the Cloudflare API (…) failed. »
      # SANS le code ni le corps de la réponse. Ça a coûté cher une fois : depuis l'ajout du
      # cron du rappel quotidien, le script se déployait bien mais l'appel à /schedules
      # échouait — donc AUCUN trigger cron en production, et aucun moyen de savoir pourquoi
      # depuis GitHub. Le journal de wrangler, lui, porte la réponse complète.
      # (Les secrets du job restent masqués par GitHub Actions.)
      - name: Détail de l'échec (journal wrangler)
        if: failure()
        run: tail -n 200 ~/.config/.wrangler/logs/*.log
