name: Build grammar examples corpus

# Génère le corpus de phrases par point de grammaire (app/src/data/inventory/grammar-examples.json)
# via le Worker (kind grammar-examples, cache R2) puis committe le résultat sur la branche
# de dispatch. Manuel uniquement : la génération consomme du quota Gemini côté Worker.
# Prérequis : le Worker déployé doit connaître le kind grammar-examples (deploy-worker.yml).

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Niveau JLPT des leçons (5, 4 ou 3 ; vide = tout le curriculum)"
        required: false
        default: ""
      limit:
        description: "Nombre de points (vide = tous)"
        required: false
        default: ""
      refresh:
        description: "Ignorer le cache R2 et régénérer"
        type: boolean
        default: false

permissions:
  contents: write

# Un seul run à la fois : deux générations concurrentes pousseraient des commits en conflit.
concurrency:
  group: build-grammar-examples
  cancel-in-progress: false

jobs:
  build-grammar-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Générer le corpus
        run: >-
          npm run data:grammar-examples --
          ${{ inputs.level && format('--level {0}', inputs.level) || '' }}
          ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
          ${{ inputs.refresh && '--refresh' || '' }}
        env:
          # Même variable de repo que deploy.yml ; le script retombe sur le Worker déployé si absente.
          WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      # Garde-fou : un push du bot (GITHUB_TOKEN) ne déclenche pas la CI — on vérifie donc
      # ICI que le nouveau corpus ne casse aucun test avant de le committer sur la branche.
      - name: Tester avec le corpus regénéré
        run: npm test
      - name: Committer le corpus regénéré
        run: |
          if git diff --quiet app/src/data/inventory/grammar-examples.json; then
            echo "Corpus inchangé — rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/data/inventory/grammar-examples.json
          git commit -m "data: régénération des phrases de grammaire (workflow build-grammar-examples)"
          git push
