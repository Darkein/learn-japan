name: Build kanji part glosses corpus

# Génère les gloses françaises des composants de kanji absents de l'inventaire
# (app/src/data/inventory/kanji-parts-fr.json) via le Worker (kind part-gloss, cache R2) puis
# committe le résultat sur la branche de dispatch. Manuel uniquement : la génération consomme
# du quota côté Worker. Deux prérequis : le Worker déployé doit connaître le kind part-gloss
# (deploy-worker.yml, sur push de worker/** vers main), et kanji-parts.json doit être committé
# (npm run data:parts).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de composants, les plus fréquents d'abord (vide = tous)"
        required: false
        default: ""
      refresh:
        description: "Ignorer le cache R2 et les entrées existantes"
        type: boolean
        default: false

permissions:
  contents: write

# Un seul run à la fois : deux générations concurrentes pousseraient des commits en conflit.
concurrency:
  group: build-kanji-parts-fr
  cancel-in-progress: false

jobs:
  build-kanji-parts-fr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Générer les gloses
        run: >-
          npm run data:parts-fr --
          ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
          ${{ inputs.refresh && '--refresh' || '' }}
        env:
          # Même variable de repo que deploy.yml ; le script retombe sur le Worker déployé si absente.
          WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      # Garde-fou : un push du bot (GITHUB_TOKEN) ne déclenche pas la CI — on vérifie donc
      # ICI que le nouveau corpus ne casse aucun test avant de le committer sur la branche.
      - name: Tester avec le corpus regénéré
        run: npm test
      - name: Committer le corpus regénéré
        run: |
          if git diff --quiet app/src/data/inventory/kanji-parts-fr.json; then
            echo "Corpus inchangé — rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/data/inventory/kanji-parts-fr.json
          git commit -m "data: régénération des gloses de composants (workflow kanji-parts-fr)"
          git push
